[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-coverless-steganography"
version = "0.1.0"
description = "Paper-based research implementation of face-and-pose coverless image steganography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
generation = ["torch>=2.1", "diffusers>=0.30,<1", "transformers>=4.44,<5", "accelerate>=0.34", "safetensors>=0.4"]
face = ["torch>=2.1", "torchvision>=0.16", "timm==0.6.13", "opencv-python>=4.8", "retina-face>=0.0.17"]

[project.scripts]
hcs = "hcs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hcs*"]
